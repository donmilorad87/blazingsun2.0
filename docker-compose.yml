# Local development stack: nginx (frontend + /api) → PHP-FPM 8.5 → MySQL.
#   npm run docker:up      start everything (http://127.0.0.1:8080)
#   npm run db:migrate     create/update tables and procedures
# Ports bind to 127.0.0.1 only; override with BLAZINGSUN_HTTP_PORT / BLAZINGSUN_DB_PORT in a .env file.
name: blazingsun

services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:${BLAZINGSUN_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/var/www/dist:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build: ./docker/php
    # Run as your user so composer/vendor files on the host stay yours.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/server
    volumes:
      - ./server:/var/www/server
      - ./docker/php/config.local.php:/var/www/config.local.php:ro
    environment:
      BLAZINGSUN_API_CONFIG: /var/www/config.local.php
      # Used by `composer test:integration` inside this container.
      TEST_DB_HOST: mysql
      TEST_DB_PORT: "3306"
      TEST_DB_NAME: blazingsun_test
      TEST_DB_USER: blazingsun
      TEST_DB_PASSWORD: blazingsun
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:26.10
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blazingsun
      MYSQL_USER: blazingsun
      MYSQL_PASSWORD: blazingsun
    ports:
      - "127.0.0.1:${BLAZINGSUN_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
