# Mirrors production: the built site from dist/, and /api/* handled by server/public/index.php.
server {
	listen 80;
	server_name blazingsun.local localhost;
	root /var/www/dist;
	index index.html;
	charset utf-8;

	location = /api {
		return 301 /api/;
	}

	location ^~ /api/ {
		include fastcgi_params;
		fastcgi_pass php:9000;
		fastcgi_param SCRIPT_FILENAME /var/www/server/public/index.php;
		fastcgi_param HTTP_AUTHORIZATION $http_authorization;
	}

	# The service worker must always be revalidated so new deploys are picked up.
	location = /sw.js {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
