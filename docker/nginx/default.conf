# Mirrors production: the built site from dist/, the page (/ and /{iso2}/) rendered by server/public/page.php,
# /api/* handled by server/public/index.php, admin uploads from uploads/.
server {
	listen 80;
	server_name blazingsun.local localhost;
	root /var/www/dist;
	index index.html;
	charset utf-8;
	client_max_body_size 12m;

	location = /api {
		return 301 /api/;
	}

	location ^~ /api/ {
		include fastcgi_params;
		fastcgi_pass php:9000;
		fastcgi_param SCRIPT_FILENAME /var/www/server/public/index.php;
		fastcgi_param HTTP_AUTHORIZATION $http_authorization;
	}

	# The public page, one URL per language.
	location ~ "^/([a-z]{2}/?)?$" {
		include fastcgi_params;
		fastcgi_pass php:9000;
		fastcgi_param SCRIPT_FILENAME /var/www/server/public/page.php;
	}

	# Uploaded images: never executed, never rendered as a document that can run scripts (SVG).
	location ^~ /uploads/ {
		alias /var/www/uploads/;
		add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
		add_header X-Content-Type-Options nosniff always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	location = /adminportal {
		return 301 /adminportal/;
	}

	location ^~ /adminportal/ {
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ /adminportal/index.html;
	}

	# The service worker must always be revalidated so new deploys are picked up.
	location = /sw.js {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
